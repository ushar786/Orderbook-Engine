<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orderbook Engine</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="symbol">BTC-USD</p>
          <h1>Orderbook Engine</h1>
        </div>
        <div class="top-actions">
          <span id="lastUpdate">last update -</span>
          <div class="status" id="connectionStatus">connecting</div>
        </div>
      </header>

      <section class="market-strip" aria-label="Market summary">
        <div>
          <span>Best Bid</span>
          <strong id="bestBid">-</strong>
        </div>
        <div>
          <span>Best Ask</span>
          <strong id="bestAsk">-</strong>
        </div>
        <div>
          <span>Spread</span>
          <strong id="spread">-</strong>
        </div>
        <div>
          <span>Bid Depth</span>
          <strong id="bidDepth">0</strong>
        </div>
        <div>
          <span>Ask Depth</span>
          <strong id="askDepth">0</strong>
        </div>
        <div>
          <span>Sequence</span>
          <strong id="sequence">0</strong>
        </div>
      </section>

      <section class="workspace">
        <aside class="left-rail">
          <form class="panel ticket" id="orderForm">
            <div class="panel-head">
              <h2>New Order</h2>
              <span id="lastOrderId">ID -</span>
            </div>

            <div class="segmented" role="group" aria-label="Side">
              <button type="button" class="active buy" data-side="buy">Buy</button>
              <button type="button" class="sell" data-side="sell">Sell</button>
            </div>

            <label>
              <span>Type</span>
              <select id="orderType">
                <option value="limit">Limit</option>
                <option value="market">Market</option>
              </select>
            </label>

            <label>
              <span>Time In Force</span>
              <select id="timeInForce">
                <option value="gtc">GTC</option>
                <option value="ioc">IOC</option>
              </select>
            </label>

            <label id="priceField">
              <span>Price</span>
              <input id="price" type="number" min="1" step="1" value="10000" />
            </label>

            <label>
              <span>Quantity</span>
              <input id="quantity" type="number" min="1" step="1" value="10" />
            </label>

            <button class="submit" id="submitOrder" type="submit">Submit</button>
            <p class="message" id="message" aria-live="polite"></p>
          </form>

          <section class="panel tools" aria-label="Order tools">
            <div class="panel-head">
              <h2>Order Tools</h2>
            </div>
            <form class="inline-form" id="cancelForm">
              <label>
                <span>Cancel ID</span>
                <input id="cancelOrderId" type="number" min="1" step="1" placeholder="Order id" />
              </label>
              <button type="submit">Cancel</button>
            </form>
            <form class="inline-form" id="historyForm">
              <label>
                <span>History ID</span>
                <input id="historyOrderId" type="number" min="1" step="1" placeholder="Order id" />
              </label>
              <button type="submit">Lookup</button>
            </form>
            <div class="history" id="history"></div>
          </section>
        </aside>

        <section class="panel book-panel" aria-label="Order book">
          <div class="panel-head">
            <h2>Order Book</h2>
            <button class="icon-button" id="refreshBook" type="button" title="Refresh data" aria-label="Refresh data">
              &#8635;
            </button>
          </div>
          <div class="book-table book-header">
            <span>Side</span>
            <span>Price</span>
            <span>Quantity</span>
            <span>Orders</span>
          </div>
          <div id="asks" class="levels asks"></div>
          <div class="midline">
            <span>Mid</span>
            <strong id="midPrice">-</strong>
          </div>
          <div id="bids" class="levels bids"></div>
        </section>

        <aside class="right-rail">
          <section class="panel orders-panel" aria-label="Orders">
            <div class="panel-head">
              <h2>Orders</h2>
              <div class="panel-actions">
                <span id="orderCount">0 tracked</span>
                <button id="massCancel" type="button">Mass Cancel</button>
              </div>
            </div>
            <div class="order-table order-header">
              <span>ID</span>
              <span>Side</span>
              <span>Status</span>
              <span>Rem</span>
              <span></span>
            </div>
            <div id="orders" class="orders"></div>
          </section>

          <section class="panel trades-panel" aria-label="Recent trades">
            <div class="panel-head">
              <h2>Trades</h2>
              <span id="tradeCount">0</span>
            </div>
            <div id="trades" class="trades"></div>
          </section>
        </aside>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
