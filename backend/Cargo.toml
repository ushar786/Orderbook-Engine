[package]
name = "orderbook-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["ushar786"]
description = "A Rust-first orderbook matching engine with REST, WebSocket, SQLite audit storage, and a static dashboard."
repository = "https://github.com/ushar786/Orderbook-Engine"
keywords = ["rust", "orderbook", "matching-engine", "trading"]
categories = ["finance", "web-programming"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
postgres = "0.19"
postgres-types = { version = "0.2", features = ["with-serde_json-1"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tower = "0.5"

[[bench]]
name = "matching"
harness = false
